name: Build M365-Copilot2API-CE ARM64


on:

  workflow_dispatch:


  schedule:

    # 每6小时检查一次上游

    - cron: "0 */6 * * *"



concurrency:

  group: m365-copilot2api-build

  cancel-in-progress: true



permissions:

  contents: read

  packages: write

  actions: write



env:

  SOURCE_REPO: s12ryt/M365-Copilot2API-CE

  PACKAGE_NAME: m365-copilot2api-ce





jobs:


# ==========================
# 检查上游更新
# ==========================

  check-update:


    runs-on: ubuntu-latest


    outputs:

      changed: ${{ steps.check.outputs.changed }}



    steps:


      - name: Checkout


        uses: actions/checkout@v4




      - name: Restore upstream SHA


        uses: actions/cache@v4

        with:

          path: .github/upstream.sha

          key: upstream-sha-cache




      - name: Check upstream commit


        id: check


        env:

          GH_TOKEN: ${{ github.token }}


        run: |


          NEW_SHA=$(gh api \
          repos/${SOURCE_REPO}/commits/main \
          --jq '.sha')



          echo "Current upstream:"
          echo "$NEW_SHA"



          OLD_SHA=""



          if [ -f .github/upstream.sha ]; then

            OLD_SHA=$(cat .github/upstream.sha)

          fi



          echo "Previous:"
          echo "$OLD_SHA"



          if [ "$NEW_SHA" != "$OLD_SHA" ]; then

            echo "changed=true" >> $GITHUB_OUTPUT

          else

            echo "changed=false" >> $GITHUB_OUTPUT

          fi



          mkdir -p .github

          echo "$NEW_SHA" > .github/upstream.sha






# ==========================
# ARM64 编译
# ==========================

  build:


    needs: check-update


    if: |

      needs.check-update.outputs.changed == 'true'

      || github.event_name == 'workflow_dispatch'



    runs-on: ubuntu-latest



    steps:


      - name: Checkout


        uses: actions/checkout@v4




      - name: Clone source


        run: |


          git clone --depth=1 \
          https://github.com/${SOURCE_REPO}.git source





      - name: Setup QEMU


        uses: docker/setup-qemu-action@v3




      - name: Setup Buildx


        uses: docker/setup-buildx-action@v3





      - name: Prepare GHCR image name


        run: |


          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')


          echo "IMAGE_NAME=ghcr.io/${OWNER}/${PACKAGE_NAME}" >> $GITHUB_ENV






      - name: Login GHCR


        uses: docker/login-action@v3


        with:


          registry: ghcr.io


          username: ${{ github.actor }}


          password: ${{ github.token }}






      - name: Build and Push ARM64


        uses: docker/build-push-action@v6


        with:


          context: ./source


          file: ./source/Dockerfile


          platforms: linux/arm64


          push: true


          tags:


            ${{ env.IMAGE_NAME }}:latest


          cache-from: type=gha


          cache-to: type=gha,mode=max






# ==========================
# 清理
# ==========================

  cleanup:


    needs: build


    if: success()


    runs-on: ubuntu-latest



    steps:



      - name: Cleanup old GHCR versions


        uses: actions/delete-package-versions@v5


        with:


          package-name: ${{ env.PACKAGE_NAME }}


          package-type: container


          min-versions-to-keep: 1


          token: ${{ github.token }}






      - name: Cleanup old workflow runs


        env:


          GH_TOKEN: ${{ github.token }}


        run: |


          gh run list \

          --workflow build.yml \

          --limit 100 \

          --json databaseId \

          --jq '.[].databaseId' \

          | grep -v "${{ github.run_id }}" \

          | xargs -r -n1 gh run delete
