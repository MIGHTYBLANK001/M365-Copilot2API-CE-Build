name: Build M365-Copilot2API-CE ARM64


on:

  workflow_dispatch:


  schedule:

    - cron: "0 2 * * *"



concurrency:

  group: m365-copilot2api-build

  cancel-in-progress: true



permissions:

  contents: read

  packages: write

  actions: write



env:

  SOURCE_REPO: s12ryt/M365-Copilot2API-CE

  PACKAGE_NAME: m365-copilot2api-ce





jobs:


# =====================================================
# 检查上游更新
# =====================================================

  check-update:


    runs-on: ubuntu-latest


    outputs:

      changed: ${{ steps.check.outputs.changed }}



    steps:


      - name: Restore upstream SHA cache

        uses: actions/cache@v4

        with:

          path: .upstream.sha

          key: upstream-sha-cache

          restore-keys: |

            upstream-sha-cache





      - name: Check upstream commit


        id: check


        env:

          GH_TOKEN: ${{ github.token }}


        run: |


          NEW_SHA=$(gh api \
          repos/${SOURCE_REPO}/commits/main \
          --jq '.sha')



          OLD_SHA=""


          if [ -f .upstream.sha ]; then

            OLD_SHA=$(cat .upstream.sha)

          fi



          echo "Current:"
          echo "$NEW_SHA"


          echo "Previous:"
          echo "$OLD_SHA"



          if [ "$NEW_SHA" != "$OLD_SHA" ]; then

            echo "changed=true" >> $GITHUB_OUTPUT

          else

            echo "changed=false" >> $GITHUB_OUTPUT

          fi



          echo "$NEW_SHA" > .upstream.sha






# =====================================================
# ARM64 Build
# =====================================================

  build:


    needs: check-update


    if: |

      needs.check-update.outputs.changed == 'true'

      || github.event_name == 'workflow_dispatch'



    runs-on: ubuntu-latest



    steps:


      - name: Checkout

        uses: actions/checkout@v4




      - name: Clone upstream source

        run: |

          git clone --depth=1 \
          https://github.com/${SOURCE_REPO}.git source





      - name: Setup QEMU

        uses: docker/setup-qemu-action@v3




      - name: Setup Buildx

        uses: docker/setup-buildx-action@v3





      - name: Prepare image name


        run: |


          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')


          echo "IMAGE_NAME=ghcr.io/${OWNER}/${PACKAGE_NAME}" >> $GITHUB_ENV






      - name: Login GHCR


        uses: docker/login-action@v3


        with:


          registry: ghcr.io


          username: ${{ github.actor }}


          password: ${{ github.token }}






      - name: Build and Push ARM64


        uses: docker/build-push-action@v6


        with:


          context: ./source


          file: ./source/Dockerfile


          platforms: linux/arm64


          push: true


          tags: |

            ${{ env.IMAGE_NAME }}:latest

            ${{ env.IMAGE_NAME }}:${{ github.sha }}



          cache-from: type=gha


          cache-to: type=gha,mode=max






# =====================================================
# Cleanup
# =====================================================

  cleanup:


    needs: build


    if: success()


    runs-on: ubuntu-latest



    steps:


      # 等待 GHCR manifest 同步

      - name: Wait GHCR sync

        run: sleep 120






      # 保留最近3个版本

      - name: Cleanup GHCR versions


        uses: actions/delete-package-versions@v5


        with:


          package-name: m365-copilot2api-ce


          package-type: container


          min-versions-to-keep: 3


          delete-only-untagged-versions: false


          token: ${{ github.token }}







      # 清理 Actions 历史

      - name: Cleanup workflow runs


        env:


          GH_TOKEN: ${{ github.token }}


        run: |


          RUN_IDS=$(gh api \
          repos/${{ github.repository }}/actions/workflows/build.yml/runs \
          --jq '.workflow_runs[].id')



          for RUN_ID in $RUN_IDS

          do

            if [ "$RUN_ID" != "${{ github.run_id }}" ]

            then

              echo "Delete run $RUN_ID"


              gh api \
              --method DELETE \
              repos/${{ github.repository }}/actions/runs/$RUN_ID


            fi

          done
